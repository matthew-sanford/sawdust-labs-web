<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terms of Service — Crossbar | Sawdust Labs</title>
<meta name="description" content="Terms of Service for Crossbar, by Sawdust Labs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'%3E%3Crect x='8' y='14' width='18' height='7' rx='3.5' fill='%23b3603a'/%3E%3Crect x='8' y='24.5' width='30' height='7' rx='3.5' fill='%238f4c2f'/%3E%3Crect x='8' y='35' width='40' height='7' rx='3.5' fill='%233a2f26'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.97 0.014 75);
    --fg: oklch(0.22 0.02 60);
    --fg-soft: oklch(0.22 0.02 60 / 0.62);
    --fg-faint: oklch(0.22 0.02 60 / 0.4);
    --panel: oklch(0.21 0.02 55);
    --panel-fg: oklch(0.97 0.014 75);
    --accent: oklch(0.62 0.13 40);
    --accent-dark: oklch(0.52 0.13 40);
    --border: oklch(0.22 0.02 60 / 0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Manrope', sans-serif;
    min-height: 100%;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 32px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .mark { flex-shrink: 0; }

  .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--fg-soft);
  }

  main {
    flex: 1;
    padding: 24px 24px 80px;
  }

  .doc {
    max-width: 720px;
    margin: 0 auto;
  }

  .doc h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(28px, 4vw, 38px);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin: 24px 0 8px;
  }

  .product-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .effective-date {
    font-size: 14px;
    color: var(--fg-faint);
    margin: 0 0 40px;
  }

  .placeholder {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 32px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--fg-soft);
  }

  footer {
    padding: 32px 24px;
    text-align: center;
    font-size: 13px;
    color: var(--fg-faint);
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <a class="brand" href="/">
      <svg class="mark" width="28" height="28" viewBox="0 0 56 56" fill="none" aria-hidden="true">
        <rect x="8" y="14" width="18" height="7" rx="3.5" fill="var(--accent)"></rect>
        <rect x="8" y="24.5" width="30" height="7" rx="3.5" fill="var(--accent-dark)"></rect>
        <rect x="8" y="35" width="40" height="7" rx="3.5" fill="var(--fg)"></rect>
      </svg>
      <div class="wordmark">SAWDUST LABS</div>
    </a>
  </header>

  <main>
    <div class="doc">
      <div class="product-label">Crossbar</div>
      <h1>Terms of Service</h1>
      <p class="effective-date">Effective date: August 2, 2026</p>

      <div class="placeholder">
        Placeholder — the full text of the Crossbar Terms of Service will go here.
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 Sawdust Labs
  </footer>

</div>
</body>
</html>
