<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sawdust Labs</title>
<meta name="description" content="Sawdust Labs is a sports-focused technology company.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'%3E%3Crect x='8' y='14' width='18' height='7' rx='3.5' fill='%23b3603a'/%3E%3Crect x='8' y='24.5' width='30' height='7' rx='3.5' fill='%238f4c2f'/%3E%3Crect x='8' y='35' width='40' height='7' rx='3.5' fill='%233a2f26'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.97 0.014 75);
    --fg: oklch(0.22 0.02 60);
    --fg-soft: oklch(0.22 0.02 60 / 0.62);
    --fg-faint: oklch(0.22 0.02 60 / 0.4);
    --panel: oklch(0.21 0.02 55);
    --panel-fg: oklch(0.97 0.014 75);
    --accent: oklch(0.62 0.13 40);
    --accent-dark: oklch(0.52 0.13 40);
    --border: oklch(0.22 0.02 60 / 0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Manrope', sans-serif;
    min-height: 100%;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 32px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 960px;
    margin: 0 auto;
    width: 100%;
  }

  .mark { flex-shrink: 0; }

  .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--fg-soft);
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .hero {
    max-width: 560px;
    text-align: center;
  }

  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(32px, 5vw, 44px);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin: 0 0 20px;
  }

  .hero p {
    font-size: 18px;
    line-height: 1.6;
    color: var(--fg-soft);
    margin: 0 0 32px;
  }

  .contact {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 6px;
    background: var(--accent);
    color: var(--panel);
    font-weight: 700;
    font-size: 15px;
  }

  .contact:hover { text-decoration: none; opacity: 0.9; }

  .actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .linkedin {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 6px;
    border: 1.5px solid oklch(0.22 0.02 60 / 0.3);
    color: var(--fg);
    font-weight: 700;
    font-size: 15px;
  }

  .linkedin:hover { text-decoration: none; opacity: 0.75; }

  footer {
    padding: 32px 24px;
    text-align: center;
    font-size: 13px;
    color: var(--fg-faint);
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <svg class="mark" width="28" height="28" viewBox="0 0 56 56" fill="none" aria-hidden="true">
      <rect x="8" y="14" width="18" height="7" rx="3.5" fill="var(--accent)"></rect>
      <rect x="8" y="24.5" width="30" height="7" rx="3.5" fill="var(--accent-dark)"></rect>
      <rect x="8" y="35" width="40" height="7" rx="3.5" fill="var(--fg)"></rect>
    </svg>
    <div class="wordmark">SAWDUST LABS</div>
  </header>

  <main>
    <div class="hero">
      <h1>We're building the future of sports technology.</h1>
      <p>Sawdust Labs is a sports-driven product developer. We are currently building tools that bring automatic highlight capture and performance feedback to athletes. More soon 👀</p>
      <div class="actions">
        <a class="contact" href="mailto:contact@sawdust.app">Contact us</a>
        <a class="linkedin" href="https://www.linkedin.com/company/sawdust-labs/" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 Sawdust Labs
  </footer>

</div>
</body>
</html>
